default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "" } %>

# Single database per environment. Solid Queue + Solid Cache tables live
# in the primary schema (see the create_solid_queue_and_solid_cache_tables
# migration) — a separate queue/cache database isn't worth the juggling at
# this scale, and ENV["DATABASE_URL"]'s database name overrides any
# per-entry `database:` key anyway, which silently collapsed the old
# multi-db production config into one database.

development:
  <<: *default
  database: biteworthy_dev

test:
  <<: *default
  database: biteworthy_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
