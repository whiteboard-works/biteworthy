<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive-icon FOREGROUND. The plate mark only (no white square) so
       app.json's adaptiveIcon.backgroundColor (#FFFFFF) fills the bleed; scaled to
       ~72% so the whole plate sits inside the 66% safe zone. Transparent ground. -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
    <circle cx="512" cy="512" r="416" fill="#E14E2A"/>
    <clipPath id="platef"><circle cx="512" cy="512" r="416"/></clipPath>
    <g clip-path="url(#platef)">
      <circle cx="512" cy="512" r="332" fill="none" stroke="#FFE9E1" stroke-width="14"/>
      <circle cx="852" cy="212" r="148" fill="#FFFFFF"/>
      <circle cx="716" cy="120" r="76" fill="#FFFFFF"/>
      <circle cx="928" cy="352" r="64" fill="#FFFFFF"/>
    </g>
    <text x="512" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="360" letter-spacing="-14" fill="#FFFFFF">BW</text>
  </g>
</svg>
