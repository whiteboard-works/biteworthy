name: Auto-merge

# Realizes the auto-merge policy from docs/delivery-playbook.md.
# Enables PR auto-merge (squash) on every PR. Once enabled, GitHub
# completes the merge as soon as required checks pass and required
# reviews are satisfied. Branch protection on master is what actually
# gates the merge — this workflow just opts in.
#
# Policy change 2026-04-29: dropped the `auto-merge-ok` + `claude-cd`
# label gate. The owner does not want approval to be required for
# routine work; CI green is sufficient.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          # NOT `secrets.GITHUB_TOKEN`. GitHub's recursion guard starts no
          # workflow runs for a commit pushed with it, so an auto-merged
          # PR's merge commit reaches master having triggered nothing — and
          # `deploy-api.yml` (on: push) never fires. Master looks shipped
          # while the box is stale, which is the worst shape a deploy bug
          # can take: silent, and only visible if you check `merged_by`.
          #
          # Falls back so this file is correct with or without the secret:
          # without it, merges still work and deploys still need a manual
          # dispatch, exactly as before. Add AUTOMERGE_TOKEN and the deploy
          # starts firing on its own, with no further change here.
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
