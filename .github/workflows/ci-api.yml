name: CI · API

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap change detection so `rspec` always reports a status on every
  # PR (required checks can't be satisfied by a workflow that never
  # runs), while still skipping the heavy work on irrelevant changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - "apps/api/**"
              - ".github/workflows/ci-api.yml"

  rspec:
    name: rspec · brakeman · rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biteworthy_test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      # Phase 4.11.1 — Ingestion::DishPhotoCropper depends on
      # MiniMagick which shells out to `magick`/`identify`. The
      # ubuntu-latest runner ships ImageMagick today but be explicit
      # so a future runner image change doesn't silently break us.
      - name: Install ImageMagick
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true

      - name: bundle env
        run: bundle env

      - name: db:create
        run: bin/rails db:create

      - name: db:schema:load
        run: bin/rails db:schema:load

      - name: which rspec
        run: bundle exec ruby -e 'puts Gem.bin_path("rspec-core","rspec")'

      - name: RSpec
        run: bin/rspec

      - name: Brakeman
        run: bundle exec brakeman --no-pager --quiet --format plain

      # Blocking now that apps/api/.rubocop.yml exists. It inherits Rails'
      # omakase style (which the Gemfile has carried since the start and
      # nothing ever pointed at) plus a generated .rubocop_todo.yml that
      # freezes the 1,848 pre-existing offences. New code is linted; the
      # backlog is grandfathered rather than reformatted in a 446-file sweep
      # that would conflict with every open branch. Shrink the todo when the
      # queue is quiet.
      - name: Rubocop
        run: bundle exec rubocop --parallel
