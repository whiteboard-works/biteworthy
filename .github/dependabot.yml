version: 2

# Quiet, weekly dep refresh across all three runtimes. Grouped so a
# week's bumps land as one PR per ecosystem instead of five per app.
# CI gates the merges as usual.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # Expo-SDK-coupled packages (and jest, which jest-expo is built on) must
    # move together via `npx expo install --fix`, not one at a time — piecemeal
    # bumps walked mobile from SDK 52 to 56 and broke CI for ~3 weeks in
    # June 2026. The monthly expo-align workflow owns their upgrades; see
    # docs/automations-todo.md item 5. react/react-dom are deliberately NOT
    # ignored (web needs their updates) — accepted residual risk for mobile.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "metro*"
      - dependency-name: "jest-expo"
      - dependency-name: "jest"
      - dependency-name: "@types/jest"
      - dependency-name: "react-test-renderer"
      # Stay on Tailwind v3. v4 moved its PostCSS plugin to
      # @tailwindcss/postcss and switched to CSS-first config, which breaks
      # apps/web's v3-style postcss.config.mjs + tailwind.config.ts under
      # Next 16's Turbopack build (silent — CI runs typecheck/lint/test, not
      # build, so only Vercel catches it). #421 bumped to 4.3.3 and broke
      # every deploy. Allow 3.x, block the major until a deliberate migration.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint*"]
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      tanstack:
        patterns: ["@tanstack/*"]

  - package-ecosystem: bundler
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      rails:
        patterns: ["rails", "actionpack", "actionview", "activejob",
                   "activemodel", "activerecord", "activestorage",
                   "activesupport", "actionmailer", "railties"]
      devise:
        patterns: ["devise*", "omniauth*"]
      solid:
        patterns: ["solid_*"]
      rspec:
        patterns: ["rspec*", "factory_bot*", "shoulda-*", "webmock"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
